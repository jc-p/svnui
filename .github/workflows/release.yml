name: Release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在且尚未发布的 tag（例如 0.4.2）'
        required: true
      tap_only:
        description: '仅重试已发布版本的 Homebrew tap'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - id: source
        name: Validate tag, version and commit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          tag = os.environ['TAG']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.]+)?', tag):
              raise SystemExit('tag 必须是不带 v 的版本号')
          text = pathlib.Path('Cargo.toml').read_text()
          package = re.search(r'(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)', text)[1]
          if re.search(r'(?m)^version\s*=\s*"([^"]+)"', package)[1] != tag:
              raise SystemExit('tag 与 package version 不一致')
          entries = pathlib.Path('Cargo.lock').read_text().split('[[package]]')
          locked = [e for e in entries if re.search(r'(?m)^name = "svnui"$', e)]
          if len(locked) != 1 or f'version = "{tag}"' not in locked[0].splitlines():
              raise SystemExit('lock version 不一致')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={tag}\ncommit={commit}\n')
          PY

  build:
    if: ${{ !inputs.tap_only }}
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.source.outputs.version }}
      - name: Prepare Rust and SVN
        run: |
          rustup toolchain install stable --profile minimal
          command -v svn >/dev/null || brew install subversion
          command -v svn
          command -v svnadmin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Locked dependencies and regression tests
        run: |
          cargo fetch --locked
          cargo test --offline --locked
          cargo test --offline --locked -- --ignored
          cargo check --offline --locked --no-default-features --all-targets
          cargo check --offline --locked --no-default-features --features tui --all-targets
          python3 -B -m unittest discover -s tests -p release_scripts.py
      - name: Build and package
        env:
          VERSION: ${{ needs.source.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --offline --target "$TARGET"
          test "$(./target/$TARGET/release/svnui --version)" = "svnui $VERSION"
          mkdir stage
          cp "target/$TARGET/release/svnui" stage/svnui
          tar -czf "svnui-$VERSION-$TARGET.tar.gz" -C stage svnui
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: '*.tar.gz'
          if-no-files-found: error

  release:
    if: ${{ !inputs.tap_only }}
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.source.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/releases/${{ needs.source.outputs.version }}
          merge-multiple: true
      - name: Record exact artifacts
        env:
          VERSION: ${{ needs.source.outputs.version }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          version, commit = os.environ['VERSION'], os.environ['COMMIT']
          p = pathlib.Path('dist/releases') / version
          targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin']
          artifacts = {f'svnui-{version}-{t}.tar.gz': hashlib.sha256((p / f'svnui-{version}-{t}.tar.gz').read_bytes()).hexdigest() for t in targets}
          (p / 'SHA256SUMS').write_text(''.join(f'{sha}  {name}\n' for name, sha in sorted(artifacts.items())))
          (p / 'manifest.json').write_text(json.dumps(dict(version=version, commit=commit, dirty=False, targets=targets, artifacts=artifacts), indent=2) + '\n')
          PY
      - name: Publish without overwriting and verify downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/dist.sh --offline

  update-tap:
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.release.result == 'success' || inputs.tap_only) }}
    needs: [source, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.source.outputs.version }}
      - name: Update explicit tap after verifying release
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_REPO" ] || [ -z "$TAP_TOKEN" ]; then
            echo '::warning::未配置 HOMEBREW_TAP_REPO / HOMEBREW_TAP_TOKEN，Release 已保留，跳过 tap'
            exit 0
          fi
          test "$TAP_REPO" = "${GITHUB_REPOSITORY_OWNER}/homebrew-svnui"
          mkdir -p "dist/releases/$VERSION"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "dist/releases/$VERSION" --pattern '*.tar.gz' --pattern SHA256SUMS --pattern manifest.json
          # 凭据通过 gh helper 注入，避免进入 remote URL 或日志。
          GH_TOKEN="$TAP_TOKEN" gh auth setup-git
          GH_TOKEN="$TAP_TOKEN" git clone "https://github.com/$TAP_REPO.git" "$RUNNER_TEMP/svnui-tap"
          git -C "$RUNNER_TEMP/svnui-tap" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/svnui-tap" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          unset TAP_REPO
          GH_TOKEN="$TAP_TOKEN" ./scripts/dist.sh --tap-only --tap-dir "$RUNNER_TEMP/svnui-tap"
